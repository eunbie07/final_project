[project]
name = "3d-real-image"
version = "0.1.0"
description = "2단계 AI 변환으로 3D 스크린샷을 실사화하는 프로젝트"
requires-python = ">=3.9"
dependencies = [
    "flask>=2.3.3",
    "pillow>=10.0.1",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "werkzeug>=2.3.0",
    "requests-toolbelt>=1.0.0",
    "openai>=1.99.5",
    "replicate>=1.0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
