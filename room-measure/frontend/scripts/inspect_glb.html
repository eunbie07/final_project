<!DOCTYPE html>
<html>
<head>
    <title>GLB Inspector</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <h1>GLB 파일 구조 분석</h1>
    <div id="output"></div>
    
    <script>
        const scene = new THREE.Scene();
        const loader = new THREE.GLTFLoader();
        const output = document.getElementById('output');
        
        loader.load('/low_poly_furnitures_full_bundle.glb', 
            function(gltf) {
                output.innerHTML = '<h2>GLB 파일 로드 성공!</h2>';
                
                const meshNames = [];
                const objectNames = [];
                
                gltf.scene.traverse(function(child) {
                    objectNames.push({
                        name: child.name,
                        type: child.type,
                        isMesh: child.isMesh
                    });
                    
                    if (child.isMesh) {
                        meshNames.push(child.name);
                    }
                });
                
                output.innerHTML += '<h3>모든 오브젝트들:</h3>';
                output.innerHTML += '<pre>' + JSON.stringify(objectNames, null, 2) + '</pre>';
                
                output.innerHTML += '<h3>메시들만:</h3>';
                output.innerHTML += '<pre>' + JSON.stringify(meshNames, null, 2) + '</pre>';
                
                // 가구별로 분류
                const furnitureTypes = {
                    bed: [],
                    desk: [],
                    chair: [],
                    sofa: [],
                    table: [],
                    wardrobe: []
                };
                
                meshNames.forEach(name => {
                    const nameLower = name.toLowerCase();
                    if (nameLower.includes('bed') || nameLower.includes('mattress')) {
                        furnitureTypes.bed.push(name);
                    } else if (nameLower.includes('desk') || nameLower.includes('bureau')) {
                        furnitureTypes.desk.push(name);
                    } else if (nameLower.includes('chair') || nameLower.includes('seat')) {
                        furnitureTypes.chair.push(name);
                    } else if (nameLower.includes('sofa') || nameLower.includes('couch')) {
                        furnitureTypes.sofa.push(name);
                    } else if (nameLower.includes('table') || nameLower.includes('dining') || nameLower.includes('coffee')) {
                        furnitureTypes.table.push(name);
                    } else if (nameLower.includes('wardrobe') || nameLower.includes('closet') || nameLower.includes('cabinet')) {
                        furnitureTypes.wardrobe.push(name);
                    }
                });
                
                output.innerHTML += '<h3>가구별 분류:</h3>';
                output.innerHTML += '<pre>' + JSON.stringify(furnitureTypes, null, 2) + '</pre>';
            },
            function(progress) {
                console.log('Loading progress:', progress);
            },
            function(error) {
                output.innerHTML = '<h2 style="color: red;">GLB 파일 로드 실패!</h2>';
                output.innerHTML += '<p>' + error.message + '</p>';
                console.error('GLB load error:', error);
            }
        );
    </script>
</body>
</html>
