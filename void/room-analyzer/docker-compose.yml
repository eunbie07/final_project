version: "3.8"

services:
  backend:
    build:
      context: ./backend
    container_name: room-backend
    restart: always
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/static:/app/static

  frontend:
    image: node:18
    container_name: room-frontend
    working_dir: /app
    restart: always
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"

  nginx:
    image: nginx:alpine
    container_name: room-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - backend
      - frontend

  certbot:
    image: certbot/certbot
    container_name: room-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    command: certonly --webroot --webroot-path=/var/www/certbot --email your-email@example.com --agree-tos --no-eff-email -d eunbie.site -d www.eunbie.site
